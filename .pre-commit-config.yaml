# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      # Lint + auto-fix. The "I" rule set (isort-equivalent import sorting) is already
      # enabled in pyproject.toml's [tool.ruff.lint], so this replaces isort too.
      - id: ruff
        args: [--fix]
      # Format. ruff format is a black-compatible formatter, so this replaces black.
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy gators/
        language: system
        pass_filenames: false
        types: [python]
