name: Tests

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        allow-prereleases: true
        cache: 'pip'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all]"
        pip install ruff mypy

    - name: Lint with ruff
      run: ruff check gators/

    - name: Type check with mypy
      run: mypy gators/

  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # to commit the generated coverage badge
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.13"
            os: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
  
    - name: Install libomp on macOS
      if: runner.os == 'macOS'
      run: brew install libomp

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all]"

    - name: Run tests with coverage
      run: |
        pytest

    - name: Generate coverage badge
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
      run: |
        pip install coverage-badge
        coverage-badge -f -o coverage.svg
        echo "### Coverage" >> $GITHUB_STEP_SUMMARY
        coverage report --format=markdown >> $GITHUB_STEP_SUMMARY || true

    - name: Commit coverage badge
      if: github.event_name == 'push' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add coverage.svg
        if ! git diff --cached --quiet; then
          git commit -m "chore: update coverage badge [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
        fi

    - name: Build wheel
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
      run: |
        python -m pip install build
        python -m build

    - name: Upload wheel
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
      uses: actions/upload-artifact@v5
      with:
        name: dist-packages
        path: dist/
