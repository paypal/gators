name: Auto Release

on:
  push:
    branches:
      - main
      - master

jobs:
  auto-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create tags and releases
      id-token: write  # Required for trusted publishing to PyPI

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0  # Fetch all history for tag detection

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Get version
      id: get_version
      run: |
        # Tag from the version already set in gators/__init__.py, so the tag
        # always matches the reviewed/released source instead of an
        # auto-incremented counter.
        PYTHON_VERSION=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('gators/__init__.py').read()).group(1))")
        NEW_VERSION="v$PYTHON_VERSION"

        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "Next version: $NEW_VERSION"

    - name: Check if tag already exists
      id: check_tag
      run: |
        if git ls-remote --tags origin | grep -q "refs/tags/${{ steps.get_version.outputs.new_version }}$"; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Install build dependencies
      if: steps.check_tag.outputs.exists == 'false'
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      if: steps.check_tag.outputs.exists == 'false'
      run: python -m build

    - name: Check package
      if: steps.check_tag.outputs.exists == 'false'
      run: twine check dist/*

    - name: Create and push tag
      if: steps.check_tag.outputs.exists == 'false'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git tag ${{ steps.get_version.outputs.new_version }}
        git push origin ${{ steps.get_version.outputs.new_version }}

    - name: Create GitHub Release
      if: steps.check_tag.outputs.exists == 'false'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.new_version }}
        name: Release ${{ steps.get_version.outputs.new_version }}
        draft: false
        prerelease: false
        files: dist/*
        generate_release_notes: true

    # Uncomment to auto-publish to PyPI
